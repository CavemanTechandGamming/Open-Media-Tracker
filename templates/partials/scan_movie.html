<div id="scan-movie-panel"
     class="rounded-xl border border-slate-800 bg-slate-900/50 p-4 shadow-inner shadow-black/20"
     hx-get="/fragments/scan-movie-status"
     hx-trigger="load delay:200ms, every 1s"
     hx-swap="outerHTML">
  <div class="flex items-center justify-between gap-2">
    <h3 class="text-sm font-semibold text-violet-200">Movie scan</h3>
    {% if running %}
    <span class="flex items-center gap-2 text-xs text-violet-300">
      <span class="relative flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-violet-400 opacity-60"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-violet-500"></span>
      </span>
      Running
    </span>
    {% else %}
    <span class="text-xs text-slate-500">Idle</span>
    {% endif %}
  </div>
  <p class="mt-2 truncate text-xs text-slate-400" title="{{ message }}">{{ phase }}{% if message %} · {{ message }}{% endif %}</p>
  <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-800">
    <div class="h-full rounded-full bg-gradient-to-r from-violet-600 to-fuchsia-400 transition-[width] duration-300"
         style="width: {{ percent }}%;"></div>
  </div>
  <p class="mt-2 text-[11px] text-slate-500">{{ current }} / {{ total }} folders</p>
  {% if errors and errors|length > 0 %}
  <ul class="mt-2 max-h-24 overflow-y-auto text-[11px] text-rose-300">
    {% for err in errors[-5:] %}
    <li class="truncate">{{ err }}</li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
